<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Project Survival — First Dawn</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090d20;color:#f3d4bf;font-family:Georgia,serif}canvas{display:block;width:100%;height:100%;outline:none}
#waking{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 100%,#51405a,#171c38 65%);transition:opacity 1.2s}#waking.leaving{opacity:0;pointer-events:none}.opening{text-align:center;padding:24px;max-width:580px}h1{font-size:clamp(30px,7vw,54px);font-weight:400;letter-spacing:.09em;margin:0 0 24px}.credits{font-size:14px;line-height:1.7}.tagline{font-style:italic;color:#e2ad99;margin-bottom:48px}label{display:block;font-size:15px;margin-bottom:12px}input{box-sizing:border-box;max-width:100%;width:240px;background:#25283f;border:0;border-bottom:1px solid #987e88;color:#ffe4ce;padding:12px;font:20px Georgia;text-align:center;border-radius:4px}button{display:block;margin:24px auto 10px;background:#e5b49f;color:#22243b;border:0;border-radius:30px;padding:12px 42px;font:18px Georgia;cursor:pointer}button:disabled{opacity:.35;cursor:wait}input:focus-visible,button:focus-visible{outline:2px solid #ffe1b7;outline-offset:5px}#wake-hint{font-size:13px;color:#c3aeb7;min-height:20px}#guide-line{position:fixed;z-index:5;top:24%;left:5%;width:90%;text-align:center;font-size:clamp(13px,1.75vw,23px);color:#ffe1bd;text-shadow:0 2px 14px #171c38;opacity:0;pointer-events:none;transition:opacity .9s;line-height:1.6}#guide-line.speaking{opacity:1}
</style></head><body>
<section id="waking" aria-label="Before waking"><div class="opening"><h1>Project Survival</h1><p class="credits">Designed and Made by Relic &amp; Ember Studios</p><p class="tagline">We wake worlds.</p><label for="character-name">What shall we call you? <small>(optional)</small></label><input id="character-name" type="text" maxlength="16" autocomplete="off" aria-label="Character name"><button id="wake" disabled>Wake</button><p id="wake-hint" role="status">still waking...</p></div></section>
<div id="guide-line" role="status" aria-live="polite"></div>
<script type="module" src="./js/main.js"></script></body></html>
